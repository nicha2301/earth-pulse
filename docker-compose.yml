services:
  mongodb:
    image: mongo:latest
    container_name: earth-pulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: earth-pulse
    volumes:
      - mongodb_data:/data/db
    networks:
      - earth-pulse-network

  redis:
    image: redis:7-alpine
    container_name: earth-pulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - earth-pulse-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  earth-pulse-network:
    driver: bridge
